bundle:
  name: sentinelops
workspace:
  host: https://adb-7405619144539463.3.azuredatabricks.net
include:
  - resources/*.yml
variables:
  catalog:
    description: Existing Unity Catalog catalog with CREATE SCHEMA permission
    default: sentinelops_dev
  schema:
    default: sentinelops_dev
  warehouse_id:
    description: SQL warehouse for AI/BI dashboards and Genie (2X-Small, 5-minute auto-stop)
    lookup:
      warehouse: Serverless Starter Warehouse
# data/, artifacts/ and .venv/ are git-ignored, which sync already skips. Every pattern here must
# match a tracked file: in CI's clean checkout, a pattern that matches nothing is a strict-mode error.
sync:
  include:
    - src/**
    - jobs/**
    - pipelines/**
targets:
  dev:
    default: true
    mode: development
    presets:
      pipelines_development: false
  # CI/CD targets. GitHub Actions deploys each one as its own service principal (Databricks OIDC
  # federation, no secrets), and that principal also runs every job and pipeline. Catalogs and
  # grants: scripts/setup_environment_catalogs.py. Schemas and the landing volume:
  # resources/environments.yml.
  staging:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: 02bece01-ccd7-4130-8e8d-c8de43583e41  # sentinelops-staging-ci
    variables:
      catalog: sentinelops_staging
      schema: sentinelops
    # A name_prefix preset would also rename the Unity Catalog schemas (bronze -> staging_bronze),
    # which the code addresses by name, so a tag tells the environments apart instead.
    presets:
      tags:
        environment: staging
    # The deploying principal owns its bundle folder; strict validation wants that stated here.
    permissions:
      - user_name: cheng.huang.ca@outlook.com
        level: CAN_MANAGE
      - service_principal_name: 02bece01-ccd7-4130-8e8d-c8de43583e41
        level: CAN_MANAGE
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: 5d729946-2748-48f4-9300-ba9a559bf93d  # sentinelops-prod-ci
    variables:
      catalog: sentinelops_prod
      schema: sentinelops
    # A name_prefix preset would also rename the Unity Catalog schemas (bronze -> prod_bronze),
    # which the code addresses by name, so a tag tells the environments apart instead.
    presets:
      tags:
        environment: prod
    # The deploying principal owns its bundle folder; strict validation wants that stated here.
    permissions:
      - user_name: cheng.huang.ca@outlook.com
        level: CAN_MANAGE
      - service_principal_name: 5d729946-2748-48f4-9300-ba9a559bf93d
        level: CAN_MANAGE
